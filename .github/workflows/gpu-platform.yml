# Builds wheels for one platform and tests them on that platform's GPU runner.
# Called once per platform so a failed build only skips its own GPU tests.
#
# The wheels contain only the core optix package. They link the CUDA runtime
# statically and use the driver of the machine they run on, so neither the
# wheels nor the tests need a CUDA Toolkit, cupy or any other package.

name: GPU platform

on:
  workflow_call:
    inputs:
      platform:
        description: CUDA redistributable platform, e.g. linux-x86_64
        required: true
        type: string
      build-os:
        description: GitHub-hosted runner that builds the wheels
        required: true
        type: string
      gpu-runner:
        description: NVIDIA self-hosted GPU runner that tests the wheels
        required: true
        type: string
    outputs:
      wheel-digest:
        description: Digest of the wheels from the GitHub-hosted build, see .github/scripts/wheels.py
        value: ${{ jobs.build.outputs.wheel-digest }}

permissions:
  contents: read

jobs:
  # The NVIDIA GPU runner images ship without compilers or a CUDA Toolkit, so
  # wheels are built on GitHub-hosted runners and only tested on the GPU runners.
  build:
    name: Build wheels
    runs-on: ${{ inputs.build-os }}
    timeout-minutes: 90
    outputs:
      wheel-digest: ${{ steps.wheels.outputs.digest }}
      pythons: ${{ steps.wheels.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false
      # Linux wheels are built in a manylinux container, which installs its own
      # CUDA Toolkit components below. Windows builds run directly on the runner.
      - name: Install CUDA Toolkit components
        if: startsWith(inputs.platform, 'windows')
        shell: bash
        run: uv run --no-project python .github/scripts/install_cuda.py --platform ${{ inputs.platform }} --prefix "$RUNNER_TEMP/cuda"
      # The Python versions, the manylinux policy and the repair step are in
      # pyproject.toml. Link the CUDA runtime statically because the GPU runners
      # have no CUDA runtime library to load at import time and users should not
      # need one either.
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BEFORE_ALL_LINUX: python3 {project}/.github/scripts/install_cuda.py --platform linux-x86_64 --prefix /opt/cuda
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_PATH=/opt/cuda
            CUDAToolkit_ROOT=/opt/cuda
            PATH="$PATH:/opt/cuda/bin"
            SKBUILD_CMAKE_DEFINE="CUDA_cudart_LIBRARY=/opt/cuda/lib/libcudart_static.a"
          # MSVC reads extra options from CL. PyOptiX's single pybind11 source
          # exceeds the default COFF section limit without /bigobj. Also avoid
          # the constexpr std::mutex that crashes with an msvcp140.dll older
          # than 14.40, as on the runner image and on user machines without a
          # recent VC++ Redistributable. Use the dash form so that no shell
          # rewrites "/bigobj" into a path.
          CIBW_ENVIRONMENT_WINDOWS: >-
            SKBUILD_CMAKE_DEFINE="CUDA_cudart_LIBRARY=${{ env.CUDART_STATIC_LIBRARY }}"
            CL="-bigobj -D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
      # Export the digest directly from this hosted job, independently of the
      # artifact storage shared with the self-hosted test job. The Python
      # versions become the test matrix, so every wheel that is built is tested.
      - name: Record wheel digest and Python versions
        id: wheels
        shell: bash
        run: |
          echo "digest=$(uv run --no-project python -I .github/scripts/wheels.py digest wheelhouse)" >> "$GITHUB_OUTPUT"
          echo "pythons=$(uv run --no-project python -I .github/scripts/wheels.py pythons wheelhouse)" >> "$GITHUB_OUTPUT"
      - name: Upload wheels
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ inputs.platform }}
          path: wheelhouse/*.whl
          retention-days: 7
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python }} on RTX PRO 6000
    needs: build
    runs-on: ${{ inputs.gpu-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.build.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ inputs.platform }}
          path: dist
      # Install only the wheel for this Python version and pytest. The tests run
      # from the checkout, so the wheel is the only source of the optix module.
      - name: Install the built wheel and pytest
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --clear
          uv pip install ./dist/pyoptix-*-cp"${PYTHON/./}"-*.whl pytest
      - name: Run the test suite
        run: uv run --no-sync pytest test --junitxml=test-results/python-${{ matrix.python }}.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-${{ inputs.platform }}-py${{ matrix.python }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
