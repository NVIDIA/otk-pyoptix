# Builds and checks the wheels on every pull request and on every push to
# master. Nothing is published, see release.yml for that.

name: Wheels

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Linux
            platform: linux-x86_64
            build-os: ubuntu-24.04
          - os-name: Windows
            platform: windows-x86_64
            build-os: windows-2022
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      build-os: ${{ matrix.build-os }}
